<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Scrolling Gallery</title>
    <style>
        /* Horizontal Side-Scrolling Gallery Styling */
        .scrolling-gallery {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }

        .scrolling-gallery::-webkit-scrollbar {
            height: 8px;
        }

        .scrolling-gallery::-webkit-scrollbar-track {
            background: rgba(26, 29, 40, 0.5);
            border-radius: 4px;
        }

        .scrolling-gallery::-webkit-scrollbar-thumb {
            background: #00d2d3;
            border-radius: 4px;
        }

        .scrolling-gallery img {
            height: 220px;
            width: 320px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #00d2d3;
            box-shadow: 0 4px 10px rgba(0, 210, 211, 0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .scrolling-gallery img:hover {
            transform: scale(1.03);
            border-color: #2ed573;
        }
    </style>
</head>
<body>

    <!-- Gallery Component -->
    <div class="scrolling-gallery">
        <img src="https://i.postimg.cc/zG46wMNg/update-pic.jpg" alt="Update Image 1">
        <img src="https://i.postimg.cc/zG46wMNg/update-pic.jpg" alt="Update Image 2">
        <img src="https://i.postimg.cc/zG46wMNg/update-pic.jpg" alt="Update Image 3">
        <img src="https://i.postimg.cc/zG46wMNg/update-pic.jpg" alt="Update Image 4">
    </div>

</body>
</html>
